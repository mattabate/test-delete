<!doctype html><html><head><meta charset="utf-8"><title>rc1328-qa-decide</title>
<style>:root{--bg:#fff;--fg:#111;--mut:#666}@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#aaa}}
body{font-family:system-ui,sans-serif;margin:24px;background:var(--bg);color:var(--fg)}button{margin:4px 6px 4px 0;padding:6px 10px}
pre{white-space:pre-wrap;font-size:12px;border:1px solid var(--mut);padding:8px;max-height:420px;overflow:auto}</style></head>
<body><h2>rc1328-qa-decide lemur</h2>
<p>QA probe for release 1.3.28 rc.1 (#16984): calls ana.decide on text and on a generated image (file path, bytes, dict), plus two bad-image cases that must fail with a clear message.</p>
<div id="btns"></div><pre id="out">Click a button to run a compute function.</pre>
<script>
const runs=[['decide_text',{text:'URGENT: production database is down and all customers are blocked since 3am.'}],
['decide_image',{mode:'path'}],['decide_image',{mode:'bytes'}],['decide_image',{mode:'dict'}],['decide_image',{mode:'missing'}],['decide_image',{mode:'txt'}]];
const out=document.getElementById('out');
for(const [fn,p] of runs){const b=document.createElement('button');b.textContent=fn+(p.mode?' ('+p.mode+')':'');
b.onclick=async()=>{if(!(window.ana&&ana.compute&&ana.compute.available)){out.textContent='Compute is not available in this view.';return;}
out.textContent='Running '+b.textContent+'...';try{const r=await ana.compute.run(fn,p);out.textContent=JSON.stringify(r,null,2);}catch(e){out.textContent='Error: '+(e&&e.message||e);}};
document.getElementById('btns').appendChild(b);}
</script></body></html>
