<!doctype html><html><head><meta charset="utf-8"><title>rc1328 app-db QA</title>
<style>body{font-family:system-ui,sans-serif;margin:24px;background:#fff;color:#111}@media (prefers-color-scheme:dark){body{background:#111;color:#eee}}
table{border-collapse:collapse}td,th{border:1px solid #888;padding:4px 8px;font-size:13px}</style></head>
<body><h2>rc1328 app-db QA</h2><p>Stored-data performance probe for release 1.3.28 rc.1 (#17200/#17093). Reads the app's private database.</p>
<div id="stats">Loading...</div><h3>Latest marks</h3><div id="marks"></div>
<script>
async function load(){
  if(!(window.ana && ana.compute && ana.compute.available)){document.getElementById('stats').textContent='Compute is not available in this view.';return;}
  try{
    const t0=performance.now();
    const s=await ana.compute.run('stats',{});
    const t1=performance.now();
    const r=(s&&s[0])||{};
    document.getElementById('stats').textContent=`bulk rows: ${r.bulk_rows}, marks: ${r.marks}, stats read took ${Math.round(t1-t0)} ms`;
    const m=await ana.compute.run('latest_marks',{});
    document.getElementById('marks').innerHTML='<table><tr><th>k</th><th>v</th><th>ts</th></tr>'+(m||[]).map(x=>`<tr><td>${x.k}</td><td>${x.v}</td><td>${x.ts}</td></tr>`).join('')+'</table>';
  }catch(e){document.getElementById('stats').textContent='Error: '+e;}
}
load();
</script></body></html>
